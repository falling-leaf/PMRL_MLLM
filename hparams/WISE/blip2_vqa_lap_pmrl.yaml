# Canonical BLIP2 VQA WISE+ASAM (LAP+PMRL). Same knobs as the IC ASAM config.
# Source: hparams/WISE/blip2_ic_lap_pmrl.yaml
alg_name: "WISE"
name: /root/hugging_cache/opt-2.7b
model_name: blip2
tokenizer_class: GPT2Tokenizer
tokenizer_name: /root/hugging_cache/opt-2.7b
device: 0
dtype: torch.float32

mask_ratio: 0.2
edit_lr: 1.0
n_iter: 10
norm_constraint: 1.0
act_margin: [5.0, 20.0, 10.0]
act_ratio: 0.4
save_freq: 500
merge_freq: 1000
merge_alg: ties
objective_optimization: only_label
inner_params:
  - opt_model.model.decoder.layers[23].fc1.weight
densities: 0.53
weights: 1.0
retrieve: false
replay: false
sequential_edit: false
model_parallel: false
use_chat_template: false
exact_match: true
hidden_act: relu
qformer_checkpoint: /root/hugging_cache/blip2_pretrained_opt2.7b.pth
qformer_name_or_path: /root/hugging_cache/bert-base-uncased
state_dict_file: /root/hugging_cache/eva_vit_g.pth
pretrained_ckpt: null
file_type: image
coco_image: /root/MMEdit/images
rephrase_image: /root/MMEdit/images

using_extra: true
using_lap: true
using_pmrl: true
using_image_embedding: false
num_rephrase: 5
lap_epsilon: 0.001
pmrl_tau_alignment: 0.05
pmrl_tau_regularization: 0.1
pmrl_scale: 1.0
export_lap_samples: false
