# LLaVA-OV (Qwen2-7B) MEND meta-training baseline for IC — full training.
# Model
device: 0
name: /root/hugging_cache/llava-onevision-qwen2-7b-ov-hf
model_name: llava-onevision
model_class: llava-onevision
tokenizer_class: .
tokenizer_name: .
dtype: torch.bfloat16
inner_params:
- model.language_model.layers.27.mlp.up_proj.weight
- model.language_model.layers.27.mlp.down_proj.weight

# Method
alg: MEND
lr: 1e-6
edit_lr: 1e-4
lr_lr: 1e-4
seed: 42
cedit: 0.1
iedit: 0.1
cloc: 1.0
cbase: 1.0
dropout: 0.0
train_base: False
no_grad_layers: null
one_sided: False
n_hidden: 1
hidden_dim: null
init: id
norm: True
combine: True
x_only: False
delta_only: False
act: relu
rank: 1920
mlp_class: IDMLP
shared: True
archive: null

# Train — full 30k iterations
batch_size: 1
model_save_pt: 5000
silent: False
max_iters: 30000
log_interval: 200
eval_log_interval: 5000
final_eval: True
val_interval: 5000
early_stop_patience: 20000
early_stop_key: "loss/total_edit_val"
eval_only: False
half: False
debug: False
save: True
verbose: True

val_batch_size: 1
accumulate_bs: 2
val_steps: 100
opt: Adam
grad_clip: 100.

# Output
results_dir: ./results/MEND_LLAVAOV_BASELINE_META_TRAIN

# Multimodal
exact_match: True
qformer_checkpoint: .
qformer_name_or_path: .
state_dict_file: .
coco_image: /root/MMEdit/images
rephrase_image: /root/MMEdit/images

# MEND baseline mode
using_extra: false
using_lap: false
using_pmrl: false
using_image_embedding: true
num_rephrase: 5
lap_epsilon: 0.001
pmrl_tau_alignment: 0.05
pmrl_tau_regularization: 0.1
pmrl_alignment_weight: 1.0
pmrl_regularization_weight: 0.1
pmrl_scale: 1.0
mend_log_grad_diagnostics: false
checkpoint_before_validation: true