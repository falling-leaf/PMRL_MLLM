# LLaVA-OV MEND IC: outer-loop ASAM on the hypernetwork (no inner LAP+PMRL).
# Launch: PMRL_MEND_HPARAMS=hparams/TRAINING/MEND/llavaov-7b-ic-asam-outer.yaml python run_mend_llavaov_ic_train.py
# Resume: automatic from results/MEND_LLAVAOV_IC_ASAM_OUTER/models/MEND/llava-onevision.last
#         or PMRL_MEND_RESUME=<path-to-.last|.prevalidation|.stepN>
device: 0
name: /root/hugging_cache/llava-onevision-qwen2-7b-ov-hf
model_name: llava-onevision
model_class: llava-onevision
tokenizer_class: .
tokenizer_name: .
dtype: torch.bfloat16
inner_params:
- model.language_model.layers.27.mlp.up_proj.weight
- model.language_model.layers.27.mlp.down_proj.weight
alg: MEND
lr: 1e-6
edit_lr: 0.0001
lr_lr: 0.0001
seed: 42
cedit: 0.1
iedit: 0.1
cloc: 1.0
cbase: 1.0
dropout: 0.0
train_base: false
no_grad_layers: null
one_sided: false
n_hidden: 1
hidden_dim: null
init: id
norm: true
combine: true
x_only: false
delta_only: false
act: relu
rank: 1920
mlp_class: IDMLP
shared: true
archive: null
batch_size: 1
model_save_pt: 2000
silent: false
max_iters: 30000
log_interval: 200
eval_log_interval: 5000
final_eval: true
val_interval: 5000
early_stop_patience: 20000
early_stop_key: acc/loc_floored_val
eval_only: false
half: false
debug: false
save: true
verbose: true
val_batch_size: 1
accumulate_bs: 2
val_steps: 100
opt: Adam
grad_clip: 100.0
results_dir: ./results/MEND_LLAVAOV_IC_ASAM_OUTER
exact_match: true
qformer_checkpoint: .
qformer_name_or_path: .
state_dict_file: .
coco_image: /root/MMEdit/images
rephrase_image: /root/MMEdit/images
using_extra: false
using_lap: false
using_pmrl: false
using_image_embedding: true
num_rephrase: 5
using_asam: true
asam_epsilon: 0.002
asam_scale_rho: 0.1
asam_replace: true
baseline_t_loc: 0.9747769832611084
baseline_m_loc: 0.7139328718185425
mend_log_grad_diagnostics: false
checkpoint_before_validation: true
dataloader_num_workers: 0
gpu_cache_free_threshold_gb: 8.0
kl_chunk_size: 32
